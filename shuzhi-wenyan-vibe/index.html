<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数智文言·Vibe版</title>
<style>
body{font-family:"Noto Serif SC",serif;background:#f7f3ea;color:#2b2b2b;margin:0;padding:0;line-height:1.7}
header{background:#2b2b2b;color:#f7f3ea;padding:20px}
h1{margin:0;font-size:28px}
nav button{margin:8px 8px 0 0;padding:8px 16px;border:1px solid #d8cfc0;background:transparent;color:#f7f3ea;border-radius:999px;cursor:pointer}
nav button:hover{background:#b23a2a;border-color:#b23a2a}
main{max-width:1000px;margin:0 auto;padding:20px}
section{display:none}
section.active{display:block}
.card{background:#fffdf8;border:1px solid #e0d8c8;border-radius:12px;padding:16px;margin:10px 0;cursor:pointer}
.card:hover{border-color:#c9a227}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.line{padding:10px;border-bottom:1px dashed #e0d8c8;cursor:pointer}
.line:hover{background:#faf6ec}
.note{display:none;margin-top:8px;padding:8px;background:#f7f1e4;border-left:4px solid #c9a227;border-radius:6px}
.line.open .note{display:block}
.option{display:block;width:100%;text-align:left;margin:8px 0;padding:10px;border:1px solid #e0d8c8;border-radius:8px;background:#fff;cursor:pointer}
.option:hover{border-color:#c9a227}
.correct{background:#e8f5e9;border-color:#2e7d32}
.wrong{background:#ffebee;border-color:#c62828}
.feedback{margin-top:12px;padding:10px;background:#f7f1e4;border-radius:8px}
canvas{background:#fffdf8;border:1px solid #e0d8c8;border-radius:12px}
.small{font-size:13px;color:#7a7266}
button.primary{background:#b23a2a;color:#fff;border:none;padding:10px 18px;border-radius:8px;cursor:pointer}
button.ghost{background:#fffdf8;border:1px solid #e0d8c8;padding:10px 18px;border-radius:8px;cursor:pointer}
</style>
</head>
<body>
<header>
<h1>数智文言 · Vibe 版</h1>
<p class="small">高中古诗文启发式伴学助手</p >
<nav>
<button onclick="showTab('study')">学习台</button>
<button onclick="showTab('quiz')">小测</button>
<button onclick="showTab('dashboard')">学情</button>
</nav>
</header>
<main>
<section id="study" class="active">
<h2>学习台</h2>
<div id="poemList" class="grid"></div>
<div id="detail"></div>
</section>
<section id="quiz">
<h2>小测 · 错因追踪</h2>
<div id="quizArea">点击“开始小测”生成题目。</div>
<button class="primary" onclick="startQuiz()">开始小测</button>
<button class="ghost" id="nextBtn" onclick="startQuiz()" disabled>下一题</button>
</section>
<section id="dashboard">
<h2>学情画像</h2>
<div style="display:flex;flex-wrap:wrap;gap:20px">
<div>
<canvas id="radar" width="400" height="320"></canvas>
<p class="small">维度：识记、理解、鉴赏、表达</p >
</div>
<div style="flex:1;min-width:260px">
<h3>错题本</h3>
<div id="wrongList"></div>
<button class="ghost" onclick="resetData()">重置数据</button>
</div>
</div>
</section>
</main>
<script>
const poems=[
{title:'劝学',author:'荀子',dynasty:'先秦',genre:'议论性散文',lines:[
{text:'君子曰：学不可以已。',note:'已：停止。',trans:'君子说：学习是不可以停止的。',q:'“已”是什么意思？'},
{text:'青，取之于蓝，而青于蓝；冰，水为之，而寒于水。',note:'青：靛青；蓝：蓝草；为：凝结。',trans:'靛青从蓝草中提取，却比蓝草更深；冰是水凝结的，却比水更寒冷。',q:'这里用“青”和“冰”说明什么道理？'},
{text:'君子博学而日参省乎己，则知明而行无过矣。',note:'参省：检验反省；知：同“智”。',trans:'君子广泛学习并且每天反省自己，就能智慧明达、行为没有过错。',q:'“日”是什么词类活用？'},
{text:'锲而舍之，朽木不折；锲而不舍，金石可镂。',note:'锲：雕刻；镂：雕刻。',trans:'雕刻一下就放弃，朽木也不能折断；坚持雕刻不放弃，金石也能雕出花纹。',q:'这句话强调什么品质？'}
]},
{title:'师说',author:'韩愈',dynasty:'唐',genre:'议论性散文',lines:[
{text:'古之学者必有师。师者，所以传道受业解惑也。',note:'学者：求学的人；所以：用来……的；受：同“授”。',trans:'古代求学的人一定有老师。老师，是用来传授道理、教授学业、解答疑惑的人。',q:'“学者”的古今义有什么不同？'},
{text:'是故无贵无贱，无长无少，道之所存，师之所存也。',note:'无：无论。',trans:'因此无论地位高低贵贱，无论年纪大小，道理存在的地方，就是老师存在的地方。',q:'韩愈认为择师的标准是什么？'},
{text:'句读之不知，惑之不解，或师焉，或不焉，小学而大遗，吾未见其明也。',note:'句读：断句；不：同“否”；小学：小的方面学习。',trans:'不懂得断句，不能解决疑惑，有的向老师学习，有的却不向老师学习，小的方面学了，大的方面却丢了，我看不出他们明智。',q:'这里用了什么论证方法？'}
]},
{title:'赤壁赋',author:'苏轼',dynasty:'宋',genre:'文赋',lines:[
{text:'清风徐来，水波不兴。举酒属客，诵明月之诗，歌窈窕之章。',note:'徐：缓缓；兴：起；属：劝酒。',trans:'清风缓缓吹来，水面波澜不起。举起酒杯劝客人饮酒，吟诵明月诗，歌唱窈窕章。',q:'这几句营造了怎样的氛围？'},
{text:'寄蜉蝣于天地，渺沧海之一粟。哀吾生之须臾，羡长江之无穷。',note:'蜉蝣：朝生暮死的小虫；须臾：片刻。',trans:'像蜉蝣一样寄生天地间，渺小得像大海里的一粒米。哀叹生命短暂，羡慕长江无穷。',q:'这里表达了怎样的人生感慨？'},
{text:'盖将自其变者而观之，则天地曾不能以一瞬；自其不变者而观之，则物与我皆无尽也。',note:'曾：竟；一瞬：一眨眼。',trans:'从变化的一面看，天地万物连一眨眼都不曾停止变化；从不变的一面看，万物和我们都是永恒的。',q:'苏轼如何化解“哀吾生之须臾”？'}
]}
];
const quizBank=[
{q:'“学不可以已”中“已”的意思是？',options:['已经','停止','完毕','太'],answer:1,explain:'已：停止。',type:'字词释义',dim:'识记',poem:'劝学'},
{q:'“君子博学而日参省乎己”中“日”的用法？',options:['名词作状语','名词作动词','使动用法','意动用法'],answer:0,explain:'日：每天，名词作状语。',type:'字词释义',dim:'识记',poem:'劝学'},
{q:'《师说》中“古之学者必有师”的“学者”意思是？',options:['有学问的人','求学的人','老师','专家'],answer:1,explain:'学者：求学的人。',type:'字词释义',dim:'识记',poem:'师说'},
{q:'《师说》中“句读之不知，惑之不解”句式？',options:['宾语前置','状语后置','被动句','判断句'],answer:0,explain:'“之”是宾语前置标志。',type:'句法结构',dim:'理解',poem:'师说'},
{q:'《赤壁赋》中“寄蜉蝣于天地，渺沧海之一粟”表达？',options:['人生短暂渺小','长江无穷','清风明月','客喜而笑'],answer:0,explain:'感叹人生短暂、个体渺小。',type:'背景常识',dim:'鉴赏',poem:'赤壁赋'},
{q:'《赤壁赋》中苏轼化解悲伤的方式是？',options:['及时行乐','从变与不变看','逃避现实','饮酒忘忧'],answer:1,explain:'从变与不变两个角度看待事物。',type:'审题逻辑',dim:'鉴赏',poem:'赤壁赋'}
];
function showTab(id){
document.querySelectorAll('section').forEach(s=>s.classList.remove('active'));
document.getElementById(id).classList.add('active');
if(id==='dashboard')renderDashboard();
}
function renderPoems(){
document.getElementById('poemList').innerHTML=poems.map((p,i)=>`<div class="card" onclick="showDetail(${i})"><h3>${p.title}</h3><p class="small">${p.dynasty}·${p.author}·${p.genre}</p ></div>`).join('');
}
function showDetail(i){
const p=poems[i];
document.getElementById('detail').innerHTML=`<div class="card" style="cursor:default">
<h3>${p.title} <span class="small">${p.dynasty}·${p.author}</span></h3>
${p.lines.map(l=>`<div class="line" onclick="this.classList.toggle('open')">
<div>${l.text}</div>
<div class="note"><strong>注释：</strong>${l.note}<br><strong>译文：</strong>${l.trans}<br><strong>启发式问题：</strong>${l.q}</div>
</div>`).join('')}
</div>`;
}
let currentQuiz=null,answered=false;
function startQuiz(){
currentQuiz=quizBank[Math.floor(Math.random()*quizBank.length)];
answered=false;
document.getElementById('nextBtn').disabled=true;
document.getElementById('quizArea').innerHTML=`<p><strong>${currentQuiz.q}</strong></p >
<div>${currentQuiz.options.map((o,i)=>`<button class="option" onclick="choose(${i})">${String.fromCharCode(65+i)}. ${o}</button>`).join('')}</div>
<div id="feedback"></div>`;
}
function choose(i){
if(answered)return;
answered=true;
const q=currentQuiz;
const correct=i===q.answer;
document.querySelectorAll('#quizArea .option').forEach((btn,idx)=>{
btn.disabled=true;
if(idx===q.answer)btn.classList.add('correct');
if(idx===i&&!correct)btn.classList.add('wrong');
});
let records=JSON.parse(localStorage.getItem('szwy_records')||'[]');
records.push({dim:q.dim,correct});
localStorage.setItem('szwy_records',JSON.stringify(records));
if(!correct){
let wrongs=JSON.parse(localStorage.getItem('szwy_wrongs')||'[]');
wrongs.unshift({...q,chosen:i});
localStorage.setItem('szwy_wrongs',JSON.stringify(wrongs.slice(0,50)));
}
document.getElementById('feedback').innerHTML=`<div class="feedback"><strong>${correct?'正确':'错误'}</strong><br>正确答案：${String.fromCharCode(65+q.answer)}. ${q.options[q.answer]}<br>解析：${q.explain}<br><span class="small">错因：${q.type}｜维度：${q.dim}｜篇目：${q.poem}</span></div>`;
document.getElementById('nextBtn').disabled=false;
}
function renderDashboard(){
let records=JSON.parse(localStorage.getItem('szwy_records')||'[]');
const dims=['识记','理解','鉴赏','表达'];
const stats=dims.map(d=>{
const arr=records.filter(r=>r.dim===d);
const ok=arr.filter(r=>r.correct).length;
return {dim:d,total:arr.length,rate:arr.length?ok/arr.length:0};
});
drawRadar(stats);
let wrongs=JSON.parse(localStorage.getItem('szwy_wrongs')||'[]');
document.getElementById('wrongList').innerHTML=wrongs.length?wrongs.map(w=>`<div style="border-bottom:1px solid #e0d8c8;padding:8px 0"><strong>${w.q}</strong><br><span class="small">你的答案：${w.options[w.chosen]}｜正确：${w.options[w.answer]}｜${w.type}·${w.dim}·${w.poem}</span></div>`).join(''):'<p class="small">暂无错题。</p >';
}
function drawRadar(stats){
const canvas=document.getElementById('radar');
const ctx=canvas.getContext('2d');
const w=canvas.width,h=canvas.height;
ctx.clearRect(0,0,w,h);
const cx=w/2,cy=h/2+10,R=Math.min(w,h)*0.35;
const n=stats.length;
ctx.strokeStyle='#e0d8c8';
for(let ring=1;ring<=4;ring++){
ctx.beginPath();
for(let i=0;i<=n;i++){
const a=-Math.PI/2+i*2*Math.PI/n;
const r=R*ring/4;
const x=cx+Math.cos(a)*r,y=cy+Math.sin(a)*r;
i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
}
ctx.stroke();
}
stats.forEach((s,i)=>{
const a=-Math.PI/2+i*2*Math.PI/n;
ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+Math.cos(a)*R,cy+Math.sin(a)*R);ctx.stroke();
ctx.fillStyle='#5a4f3f';ctx.font='14px serif';ctx.textAlign='center';
ctx.fillText(s.dim,cx+Math.cos(a)*(R+24),cy+Math.sin(a)*(R+24));
});
ctx.beginPath();
stats.forEach((s,i)=>{
const a=-Math.PI/2+i*2*Math.PI/n;
const r=R*Math.max(0.05,s.rate);
const x=cx+Math.cos(a)*r,y=cy+Math.sin(a)*r;
i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
});
ctx.closePath();
ctx.fillStyle='rgba(178,58,42,.25)';
ctx.strokeStyle='#b23a2a';
ctx.lineWidth=2;
ctx.fill();ctx.stroke();
ctx.fillStyle='#b23a2a';ctx.font='12px serif';
stats.forEach((s,i)=>{
const a=-Math.PI/2+i*2*Math.PI/n;
const r=R*Math.max(0.05,s.rate);
const x=cx+Math.cos(a)*r,y=cy+Math.sin(a)*r;
ctx.fillText(Math.round(s.rate*100)+'%',x,y-6);
});
}
function resetData(){
if(confirm('确定重置？')){
localStorage.removeItem('szwy_records');
localStorage.removeItem('szwy_wrongs');
renderDashboard();
}
}
renderPoems();
showDetail(0);
</script>
</body>
</html>
